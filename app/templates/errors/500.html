{% extends "base.html" %}

{% block title %}Server Error - RentHive{% endblock %}

{% block content %}
<div class="text-center error-page">
    <h1 class="error-code error-500">500</h1>
    <h3><i class="fas fa-exclamation-triangle"></i> Internal Server Error</h3>

    <a href="{{ url_for('main.index') }}" class="btn btn-primary mt-3">

    </a>
</div>
{% endblock %}
