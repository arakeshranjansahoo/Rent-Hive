{% extends "base.html" %}

{% block title %}Method Not Allowed - RentHive{% endblock %}

{% block content %}
<div class="text-center error-page">
    <h1 class="error-code error-405">405</h1>
    <h3><i class="fas fa-times-circle"></i> Method Not Allowed</h3>
    <p class="text-muted">The action you tried to perform is not supported for this URL.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary mt-3">
        <i class="fas fa-home"></i> Go Home
    </a>
</div>
{% endblock %}
